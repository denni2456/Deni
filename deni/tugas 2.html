<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 2 html</title>
</head>
<body>
    
    <h3> Tabel Luas Perkebunan</h3>

    <table border="1">
        <thead>
            <th>
                <th rowspan="2">Jenis Perkebunan</th>
                <th colspan="4">Luas Tanah</th>
            </tr>
        </thead>
        <tbody>
            <tr>    
            <td>Kopi</td>
            <td>21 Hektar</td>
            <td>36 Hektar</td>
            <td>45 Hektar</td>
            <td>54 Hektar</td>
        </tr>
        <tr>
            <td>Kelapa Sawit</td>
            <td>30 Hektar</td>
            <td>27 Hektar</td>
            <td>31 Hektar</td>
            <td>20 Hektar</td>
        </tr>        
        <tr>
            <th>Total Produksi</th>
            <th colspan="2">Besaran Panen Bulanan</th>
            <th colspan="2">Besaran Panen Tahunan</th>  
        </tr>
        <tr>
            <td>Kelapa Sawit</td>
            <td colspan="2">200 Ton</td>
            <td colspan="2">450 Ton</td>
        </tr>
        </tbody>
    </table>         
</body>
</html>
